<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuis Edu — Beranda</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: var(--bg); }
    .beranda-card { text-align: center; max-width: 400px; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: var(--biru); font-size: 2.5rem; margin-bottom: 10px; }
    p { color: var(--teks-muted); margin-bottom: 30px; }
    .btn-beranda { display: block; width: 100%; padding: 15px; font-size: 1.2rem; margin-bottom: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
    .btn-guru { background: var(--biru); color: #fff; }
    .btn-guru:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="beranda-card">
    <h1>Kuis Edu</h1>
    <p>Game Kuis Rebutan Antar Tim</p>
    
    <a href="guru.html" class="btn-beranda btn-guru">Masuk Dashboard Guru</a>
    <p style="font-size: 0.9rem; margin-top: 20px;">*Untuk siswa: Masuk ke Dashboard Guru, lalu klik "Mulai Game" pada mapel yang ingin dimainkan.</p>
  </div>
</body>
</html>
