<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permainan Kuis — Kuis Edu</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* CSS khusus layar game (di dalam file agar mandiri) */
    body { overflow: hidden; user-select: none; background: #111; color: #fff; height: 100vh; margin: 0; font-family: system-ui, sans-serif; }
    #layarGame { display: flex; flex-direction: column; height: 100vh; }
    
    /* Header Skor */
    .header-skor { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #222; font-size: 2rem; font-weight: bold; }
    .skor-biru { color: #3b82f6; }
    .skor-merah { color: #ef4444; }
    .vs { color: #888; font-size: 1.5rem; }

    /* Area Soal */
    .area-soal { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; overflow-y: auto; }
    .teks-soal { font-size: 2.2rem; margin-bottom: 20px; max-width: 90%; }
    .gambar-soal { max-height: 250px; border-radius: 12px; margin-bottom: 20px; }
    
    /* Opsi PG */
    .opsi-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 80%; max-width: 800px; margin-top: 20px; }
    .opsi-btn { padding: 20px; font-size: 1.5rem; border: 3px solid #555; background: #333; color: #fff; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .opsi-btn:hover { background: #444; }
    .opsi-btn:active { transform: scale(0.98); }

    /* Input Essay */
    .essay-container { display: flex; gap: 10px; width: 80%; max-width: 800px; margin-top: 20px; }
    .essay-input { flex: 1; padding: 15px; font-size: 1.5rem; border-radius: 12px; border: none; outline: none; }
    .btn-kirim { padding: 15px 30px; font-size: 1.5rem; background: #16a34a; color: #fff; border: none; border-radius: 12px; cursor: pointer; }

    /* Area Tombol Bawah */
    .area-tombol { height: 250px; display: flex; gap: 20px; padding: 20px; background: #222; }
    .btn-bel { flex: 1; border: none; border-radius: 20px; font-size: 3rem; font-weight: bold; color: #fff; cursor: pointer; opacity: 0.3; transition: 0.2s; }
    .btn-bel.aktif { opacity: 1; cursor: pointer; }
    .btn-biru { background: #2563eb; }
    .btn-biru.aktif:active { background: #1d4ed8; }
    .btn-merah { background: #dc2626; }
    .btn-merah.aktif:active { background: #b91c1c; }

    /* Timer */
    .timer-bulat { position: absolute; top: 100px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: #eab308; color: #000; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; box-shadow: 0 0 20px rgba(234,179,8,0.5); display: none; }
    .timer-bulat.tampil { display: flex; }

    /* Overlay Status (misal "Biru Siap Menjawab!") */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; }
    .overlay h1 { font-size: 4rem; margin: 0; }
    .overlay p { font-size: 2rem; color: #ccc; }
    .overlay.hidden { display: none; }
    .btn-lanjut { padding: 20px 40px; font-size: 2rem; background: #16a34a; color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>

<div id="layarGame">
  <!-- Header Skor -->
  <div class="header-skor">
    <div class="skor-biru">BIRU: <span id="skorBiru">0</span></div>
    <div class="vs">VS</div>
    <div class="skor-merah">MERAH: <span id="skorMerah">0</span></div>
  </div>

  <!-- Timer -->
  <div class="timer-bulat" id="timerUi">10</div>

  <!-- Area Soal -->
  <div class="area-soal" id="areaSoal">
    <!-- Diisi oleh JS -->
  </div>

  <!-- Area Tombol Bel (Bawah) -->
  <div class="area-tombol">
    <button class="btn-bel btn-biru" id="btnBiru">BIRU</button>
    <button class="btn-bel btn-merah" id="btnMerah">MERAH</button>
  </div>
</div>

<!-- Overlay (untuk jeda, skor, dsb) -->
<div class="overlay hidden" id="overlay">
  <h1 id="overlayJudul"></h1>
  <p id="overlayPesan"></p>
  <button class="btn-lanjut" id="overlayBtn">Lanjut</button>
</div>

<script src="js/storage.js"></script>
<script src="js/game.js"></script>
</body>
</html>
